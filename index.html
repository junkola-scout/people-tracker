:root{--bg:#151619;--panel:#1b1c20;--line:#34363c;--line2:#2a2c31;--text:#f4f4f5;--soft:#dcdde2;--mid:#c9cad1;--muted:#9a9ba4;--accent:#f5b16c;--blue:#8ab4f8;--green:#6fcf97;--red:#ff9b8f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Google Sans","Google Sans Text",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch}
nav{flex:1 1 236px;max-width:236px;min-width:200px;background:var(--panel);border-right:1px solid var(--line2);padding:20px 10px;display:flex;flex-direction:column;gap:18px}
.brand{padding:0 6px}.brand .logo{font-size:20px;font-weight:800;letter-spacing:.04em}
.brand .org{font-size:13px;font-weight:700;margin-top:14px}.brand .sub{font-size:12px;color:var(--muted);margin-top:4px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navlabel{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:6px 8px}
.navitem{text-align:left;background:transparent;border:0;border-radius:6px;font-size:14px;padding:9px 10px}
.navitem:hover{background:#24262b}.navitem.on{background:var(--line2)}
main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line2)}
header .title{font-size:15px;font-weight:700}
header .sync{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mid)}
.btn{background:#24262b;border:1px solid var(--line);border-radius:6px;font-size:12px;font-weight:700;padding:8px 10px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px 24px 0;border-bottom:1px solid var(--line2)}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);font-size:13px;padding:10px 10px 12px}
.tab.on{color:var(--text);font-weight:800;border-bottom-color:var(--accent)}
.view{padding:20px 24px 48px;display:flex;flex-direction:column;gap:22px}
.headrow{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
h1{margin:0;font-size:20px;font-weight:600}
.stats{font-size:12px;color:var(--mid)}.stats b{color:var(--text)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mid)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 240px;max-width:320px;height:40px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;padding:0 12px}
.search::placeholder{color:var(--muted)}
.pill{height:40px;border-radius:20px;font-size:13px;padding:0 14px;background:transparent;border:1px solid var(--line)}
.pill.on{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:700}
h2.sec{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card:hover,.row:hover{background:#202227}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.who>span:last-child{display:flex;flex-direction:column;min-width:0}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.av.sm{width:30px;height:30px;font-size:11px}.av.lg{width:56px;height:56px;font-size:18px}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.count{background:var(--bg);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.count b{font-size:20px}.count span{font-size:11px;color:var(--mid)}
.next{display:flex;flex-direction:column;gap:3px;min-height:52px}
.tag{font-size:11px;color:var(--muted)}.tag.od{color:var(--red);font-weight:700}
.nl{font-size:12px;color:var(--soft);line-height:1.35}
.lastline{font-size:11px;color:var(--muted);border-top:1px solid var(--line2);padding-top:10px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.table{min-width:860px}
.grid{display:grid;grid-template-columns:2.2fr 1.3fr 80px 80px 90px 1.2fr 2.4fr;gap:12px;align-items:center;padding:10px 16px}
.thead{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line)}
.row{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line2);font-size:13px;min-height:56px}
.row:last-child{border-bottom:0}
.row .nl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nx{display:flex;flex-direction:column;gap:2px;min-width:0}
.empty{border:1px dashed var(--line);border-radius:10px;padding:40px;text-align:center;color:var(--mid)}
.back{background:transparent;border:1px solid var(--line);border-radius:8px;font-size:13px;padding:0 14px;height:40px}
.phead{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.phead .id{display:flex;gap:14px;align-items:center}
.phead h1{font-size:22px}.phead .meta{font-size:13px;color:var(--mid);margin-top:3px}
.facts{display:flex;flex-wrap:wrap;gap:24px;font-size:11px;color:var(--muted);letter-spacing:.04em}
.facts b{display:block;font-size:13px;color:var(--text);font-weight:600;margin-top:3px;letter-spacing:0}
.brief{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;line-height:1.5;color:var(--soft)}
.cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.panel{flex:1 1 380px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.phd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.phd h2{margin:0;font-size:15px;font-weight:700}.phd span{font-size:13px;font-weight:700}
.item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2);align-items:flex-start}
.item:last-child{border-bottom:0}
.chk{flex:none;width:44px;height:44px;margin:-10px -12px;background:transparent;border:0;display:flex;align-items:center;justify-content:center}
.box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center}
.done .box{background:var(--green);border-color:var(--green)}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ttl{line-height:1.4}.done .ttl{color:var(--muted);text-decoration:line-through}
.metarow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.chip{border-radius:4px;padding:2px 7px;font-size:11px;font-weight:700}
.c-Task{color:#f5b16c;background:rgba(245,177,108,.12)}
.c-Follow-up{color:#8ab4f8;background:rgba(138,180,248,.12)}
.c-Asset{color:#c9a7f5;background:rgba(201,167,245,.12)}
.c-wait{color:#ffd27a;background:rgba(255,210,122,.12)}
.c-dec{color:#7fd4c1;background:rgba(127,212,193,.12)}
.due{color:var(--mid)}.due.od{color:var(--red);font-weight:700}.due.ok{color:var(--green)}
.hv{color:var(--green)}.ai{color:var(--accent)}

.nudge.on{background:rgba(111,207,151,.12);border-color:var(--green);color:var(--green)}
.none{padding:24px 16px;color:var(--mid);font-size:13px}
.ebtn{flex:none;height:36px;border-radius:8px;font-size:12px;font-weight:600;padding:0 10px;background:transparent;border:1px solid transparent;color:var(--mid)}
.ebtn:hover{border-color:var(--line);color:var(--text)}
.addbar{padding:8px 10px;border-top:1px solid var(--line2)}
.item:last-child{border-bottom:1px solid var(--line2)}
.item+.addbar,.edit+.addbar{border-top:0}
.add{width:100%;text-align:left;height:40px;border-radius:8px;background:transparent;border:1px dashed var(--line);color:var(--mid);font-size:13px;padding:0 12px}
.add:hover{color:var(--text);border-color:var(--muted)}
.edit{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line2);background:#202227}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fin{height:40px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;padding:0 10px;color-scheme:dark}
.ft{width:100%;font-size:14px}
.fbtn{height:36px;border-radius:8px;font-size:12px;font-weight:700;padding:0 12px;background:transparent;border:1px solid var(--line)}
.fbtn.pri{background:var(--accent);border-color:var(--accent);color:#151619}
.fbtn.del{color:var(--red)}
.seg{display:inline-flex;align-self:flex-start;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.segb{height:40px;padding:0 16px;font-size:13px;background:transparent;border:0;color:var(--mid)}
.segb.on{background:var(--line2);color:var(--text);font-weight:700}
.kb{display:grid;grid-template-columns:170px repeat(3,minmax(0,1fr));min-width:860px}
.kh{padding:12px 14px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line)}
.kh b{color:var(--text);margin-left:4px}
.kl{padding:16px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:700;border-top:1px solid var(--line2)}
.kl small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:3px}
.kdot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px}
.kc{padding:12px 10px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line2);border-left:1px solid var(--line2);min-height:96px}
.kh+.kl,.kh+.kl~.kl:nth-of-type(-n+0){border-top:0}
.kcard{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.kcard .ttl{font-size:13px}
.kcard{cursor:grab}.kcard.dragging{opacity:.4}
.kc.over{background:rgba(245,177,108,.08);outline:1px dashed var(--accent);outline-offset:-4px}
.kmv{display:flex;justify-content:space-between;gap:6px;margin-top:2px}
.kbtn{height:30px;border-radius:6px;font-size:11px;font-weight:600;padding:0 8px;background:transparent;border:1px solid var(--line2);color:var(--mid)}
.kbtn:hover{border-color:var(--muted);color:var(--text)}
.kcard.done{opacity:.75}
.ksrc{font-size:11px;color:var(--muted)}
.kempty{font-size:12px;color:var(--muted);padding:6px 4px}
.eng{display:flex;gap:12px;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--line2)}
.eng:last-child{border-bottom:0}
.eng .w{flex:none;width:56px;font-size:12px;color:var(--muted)}.eng .t{flex:1;min-width:0;line-height:1.4}.eng .k{flex:none;font-size:12px;color:var(--muted)}
.note{font-size:11px;color:var(--muted);padding:0 8px;margin-top:auto;line-height:1.4}
@media (max-width:640px){nav{max-width:none}.view{padding:16px 16px 40px}header,.tabs{padding-left:16px;padding-right:16px}}
</style>
</head>

var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],TODAY='2026-11-11',N=0;
function iso(s){var m=s.split(' '),mi=MON.indexOf(m[0])+1,d=+m[1];return '2026-'+(mi<10?'0':'')+mi+'-'+(d<10?'0':'')+d;}
function fmt(d){if(!d)return '';var a=d.split('-');return MON[+a[1]-1]+' '+(+a[2]);}
function uid(){return 'i'+(N++);}
DATA.forEach(function(p){
  ['owe','owed'].forEach(function(k){p[k]=p[k].map(function(r){return {id:uid(),k:r[0],t:r[1],due:iso(r[2]),src:r[4],v:r[5],done:false,nudged:false};});});
  ['pending','decisions'].forEach(function(k){p[k]=p[k].map(function(d){return {id:uid(),t:d[0],due:iso(d[1]),src:d[2]};});});
});
var S={sel:null,filter:'all',q:'',form:null,mode:'list'};
DATA[0].owe[1].st=1;DATA[0].owed[0].st=1;DATA[0].owe.push({id:uid(),k:'Asset',t:'Signed test-stand safety checklist',due:'2026-11-06',src:'Gmail · Nov 4',v:1,done:true,nudged:false});DATA[0].owed.push({id:uid(),k:'Follow-up',t:'Confirm rotor hub drawing release date',due:'2026-11-07',src:'Google Meet · Nov 5',v:1,done:true,nudged:false});DATA[0].pending.push({id:uid(),t:'Pick the telemetry data format for bench tests',due:'2026-11-10',src:'Google Meet',st:1});
var COLS=['Signals','In Progress','Handled'];
function toggleHTML(){
  return '<div class="seg" role="group" aria-label="View">'+[['list','List'],['board','Kanban']].map(function(m){var on=S.mode===m[0];return '<button class="segb'+(on?' on':'')+'" aria-pressed="'+on+'" data-act="mode" data-id="'+m[0]+'">'+m[1]+'</button>';}).join('')+'</div>';
}
function arrows(id,st,t){
  return '<span class="kmv">'+(st>0?'<button class="kbtn" data-act="mv" data-id="'+id+'" data-to="'+(st-1)+'" aria-label="Move to '+COLS[st-1]+': '+esc(t)+'">← '+COLS[st-1]+'</button>':'<span></span>')+(st<2?'<button class="kbtn" data-act="mv" data-id="'+id+'" data-to="'+(st+1)+'" aria-label="Move to '+COLS[st+1]+': '+esc(t)+'">'+COLS[st+1]+' →</button>':'')+'</span>';
}
function moveTo(id,to){
  var p=person(),x=find(p,id);if(!x)return;
  if(x.list==='owe'||x.list==='owed'){x.o.st=to;x.o.done=to===2;return;}
  var dest=to===2?'decisions':'pending';
  if(to===2)delete x.o.st;else x.o.st=to;
  if(x.list!==dest){x.arr.splice(x.idx,1);p[dest].unshift(x.o);}
}
function kcard(it){
  var due=it.st===2?'<span class="due ok">Done</span>':(it.od?'<span class="due od">Overdue · '+it.due+'</span>':(it.due?'<span class="due">Due '+it.due+'</span>':''));
  return '<div class="kcard'+(it.st===2?' done':'')+'" draggable="true" data-card="'+it.id+'"><span class="ttl">'+esc(it.t)+'</span><span class="metarow"><span class="chip c-'+it.k+'">'+it.k+'</span>'+due+'<span class="'+(it.v?'hv':'ai')+'" title="'+(it.v?'Human verified':'AI suggested')+'">●</span></span><span class="ksrc">'+esc(it.src)+'</span>'+arrows(it.id,it.st,it.t)+'</div>';
}
function kdec(d,st){
  return '<div class="kcard" draggable="true" data-card="'+d.id+'"><span class="ttl">'+esc(d.t)+'</span><span class="metarow"><span class="chip '+(st===2?'c-dec':'c-wait')+'">'+(st===2?'Decided':'Awaiting decision')+'</span><span class="due">'+(st===2?'':'asked ')+fmt(d.due)+'</span></span><span class="ksrc">'+esc(d.src)+'</span>'+arrows(d.id,st,d.t)+'</div>';
}
function boardHTML(x){
  var p=x.p;
  var decs=p.pending.map(function(d){var st=d.st||0;return {st:st,h:kdec(d,st)};}).concat(p.decisions.map(function(d){return {st:2,h:kdec(d,2)};}));
  var rows=[['What I Owe','var(--accent)',x.owe.map(function(i){return {st:i.st,h:kcard(i)};})],['What Is Owed to Me','var(--blue)',x.owed.map(function(i){return {st:i.st,h:kcard(i)};})],['Decisions','#7fd4c1',decs]];
  var h='<div class="tablewrap kwrap"><div class="kb"><div class="kh"></div>'+COLS.map(function(c,ci){var n=rows.reduce(function(a,r){return a+r[2].filter(function(k){return k.st===ci;}).length;},0);return '<div class="kh">'+c.toUpperCase()+' <b>'+n+'</b></div>';}).join('');
  rows.forEach(function(r,ri){
    h+='<div class="kl" data-rowlabel="'+ri+'"><span class="kdot" style="background:'+r[1]+'"></span><span>'+r[0]+'<small>'+r[2].length+' total</small></span></div>';
    for(var c=0;c<3;c++){var cs=r[2].filter(function(k){return k.st===c;});h+='<div class="kc" data-row="'+ri+'" data-st="'+c+'">'+(cs.map(function(k){return k.h;}).join('')||'<span class="kempty">Nothing here</span>')+'</div>';}
  });
  return h+'</div></div>';
}
function person(){return DATA.filter(function(p){return p.id===S.sel;})[0];}
function find(p,id){var lists=['owe','owed','pending','decisions'];for(var i=0;i<lists.length;i++){var arr=p[lists[i]];for(var j=0;j<arr.length;j++)if(arr[j].id===id)return {list:lists[i],arr:arr,idx:j,o:arr[j]};}return null;}
function formHTML(side,o,list){
  var dec=side==='dec';
  var opts=dec?[['decisions','Decided'],['pending','Awaiting decision']]:[['Task','Task'],['Follow-up','Follow-up'],['Asset','Asset']];
  var cur=o?(dec?list:o.k):opts[0][0];
  return '<form class="edit" data-side="'+side+'"><input name="t" class="fin ft" aria-label="Description" placeholder="'+(dec?'What was decided, or what needs deciding?':'What needs to be delivered?')+'" value="'+esc(o?o.t:'')+'" required>'+
    '<div class="frow"><select name="k" class="fin" aria-label="'+(dec?'Status':'Type')+'">'+opts.map(function(x){return '<option value="'+x[0]+'"'+(x[0]===cur?' selected':'')+'>'+x[1]+'</option>';}).join('')+'</select>'+
    '<input name="due" type="date" class="fin" aria-label="'+(dec?'Date':'Due date')+'" value="'+(o&&o.due?o.due:'')+'"><span style="flex:1"></span>'+
    (o?'<button type="button" class="fbtn del" data-act="del">Delete</button>':'')+'<button type="button" class="fbtn" data-act="cancel">Cancel</button><button type="submit" class="fbtn pri">Save</button></div></form>';
}
function addBar(side,label){
  if(S.form&&S.form.side===side&&!S.form.id)return formHTML(side,null);
  return '<div class="addbar"><button class="add" data-act="add" data-side="'+side+'">+ '+label+'</button></div>';
}
function editBtn(side,o){return '<button class="ebtn" data-act="edit" data-side="'+side+'" data-id="'+o.id+'" aria-label="Edit: '+esc(o.t)+'">Edit</button>';}
function decHTML(d,list){
  if(S.form&&S.form.id===d.id)return formHTML('dec',d,list);
  var wait=list==='pending';
  return '<div class="item"><div class="body"><span class="ttl">'+esc(d.t)+'</span><span class="metarow"><span class="chip '+(wait?'c-wait':'c-dec')+'">'+(wait?'Awaiting decision':'Decided')+'</span><span>'+(wait?'asked ':'')+fmt(d.due)+'</span><span>'+esc(d.src)+'</span></span></div>'+editBtn('dec',d)+'</div>';
}
var view=document.getElementById('view');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function plural(n,w){return n+' '+w+(n===1?'':'s');}
function build(){
  return DATA.map(function(p){
    var first=p.name.split(' ')[0];
    function it(o){return {id:o.id,k:o.k,t:o.t,due:fmt(o.due),st:o.done?2:(o.st||0),od:!!o.due&&o.due<TODAY&&!o.done,src:o.src,v:o.v,done:o.done,nudged:o.nudged,o:o};}
    var owe=p.owe.map(it),owed=p.owed.map(it);
    var oo=owe.filter(function(x){return !x.done;}),dd=owed.filter(function(x){return !x.done;});
    var oweOd=oo.filter(function(x){return x.od;}),owedOd=dd.filter(function(x){return x.od;}).length;
    var tag,line,od=false;
    if(oweOd.length){tag='OVERDUE FROM YOU';line=oweOd[0].t;od=true;}
    else if(oo.length){tag='YOU OWE'+(oo[0].due?' · DUE '+oo[0].due.toUpperCase():'');line=oo[0].t;}
    else if(dd.length){tag='WAITING ON '+first.toUpperCase()+(dd[0].due?' · '+dd[0].due.toUpperCase():'');line=dd[0].t;}
    else{tag='ALL CLEAR';line='Nothing open between you.';}
    return {p:p,first:first,owe:owe,owed:owed,oweN:oo.length,owedN:dd.length,odN:oweOd.length+owedOd,tag:tag,line:line,tagOd:od,
      initials:p.name.split(' ').map(function(w){return w[0];}).join(''),
      av:'background:hsl('+p.hue+',35%,26%);color:hsl('+p.hue+',80%,86%)',
      brief:'You owe '+first+' '+plural(oo.length,'item')+(oweOd.length?' ('+oweOd.length+' overdue)':'')+'. '+first+' owes you '+plural(dd.length,'item')+(owedOd?' ('+owedOd+' overdue)':'')+'. '+(p.pending.length?plural(p.pending.length,'decision')+' waiting on '+first+'. ':'')+plural(p.decisions.length,'decision')+' captured from '+first+' recently.'};
  });
}
var TESTS={all:function(){return true;},owe:function(x){return x.oweN>0;},owed:function(x){return x.owedN>0;},overdue:function(x){return x.odN>0;},decision:function(x){return x.p.pending.length>0;}};
var FILTERS=[['all','All'],['owe','I owe them'],['owed','They owe me'],['overdue','Overdue'],['decision','Awaiting their decision']];
function nextBlock(x){return '<span class="tag'+(x.tagOd?' od':'')+'">'+esc(x.tag)+'</span><span class="nl">'+esc(x.line)+'</span>';}
function listHTML(all){
  var q=S.q.trim().toLowerCase();
  var vis=all.filter(function(x){return TESTS[S.filter](x)&&(!q||(x.p.name+' '+x.p.role+' '+x.p.dept).toLowerCase().indexOf(q)>=0);});
  var sum=function(k){return all.reduce(function(a,x){return a+x[k];},0);};
  var pinned=vis.filter(function(x){return x.p.pin;}),others=vis.filter(function(x){return !x.p.pin;});
  var h='<div class="headrow"><div class="headrow" style="justify-content:flex-start"><h1>People</h1><span class="stats"><b>'+all.length+' people</b> · you owe <b>'+sum('oweN')+'</b> · owed to you <b>'+sum('owedN')+'</b> · <span style="color:var(--red)">'+sum('odN')+' overdue</span></span></div>'+
    '<div class="legend"><span><span class="hv">●</span> Human verified</span><span><span class="ai">●</span> AI suggested</span></div></div>';
  h+='<div class="controls"><input id="q" class="search" aria-label="Search people" placeholder="Search name, role or department" value="'+esc(S.q)+'">'+
    FILTERS.map(function(f){var on=S.filter===f[0];return '<button class="pill'+(on?' on':'')+'" aria-pressed="'+on+'" data-act="filter" data-id="'+f[0]+'">'+f[1]+'</button>';}).join('')+'</div>';
  if(pinned.length){h+='<section><h2 class="sec">MOST ENGAGED</h2><div class="cards">'+pinned.map(function(x){
    return '<button class="card" data-act="open" data-id="'+x.p.id+'"><span class="who"><span class="av" style="'+x.av+'" aria-hidden="true">'+x.initials+'</span><span><span class="nm">'+esc(x.p.name)+'</span><span class="rl">'+esc(x.p.role)+'</span></span></span>'+
      '<span class="counts"><span class="count"><b style="color:var(--accent)">'+x.oweN+'</b><span>You owe</span></span><span class="count"><b style="color:var(--blue)">'+x.owedN+'</b><span>Owes you</span></span></span>'+
      '<span class="next">'+nextBlock(x)+'</span><span class="lastline">Last: '+esc(x.p.last)+'</span></button>';}).join('')+'</div></section>';}
  if(others.length){h+='<section><h2 class="sec">EVERYONE ELSE</h2><div class="tablewrap"><div class="table"><div class="grid thead"><span>PERSON</span><span>DEPARTMENT</span><span>YOU OWE</span><span>OWES YOU</span><span>DECISIONS</span><span>LAST ENGAGEMENT</span><span>NEXT UP</span></div>'+others.map(function(x){
    return '<button class="grid row" data-act="open" data-id="'+x.p.id+'"><span class="who"><span class="av sm" style="'+x.av+'" aria-hidden="true">'+x.initials+'</span><span><span class="nm" style="font-weight:600">'+esc(x.p.name)+'</span><span class="rl">'+esc(x.p.role)+'</span></span></span>'+
      '<span style="color:var(--mid)">'+esc(x.p.dept)+'</span><span style="font-weight:700;color:'+(x.oweN?'var(--accent)':'var(--muted)')+'">'+x.oweN+'</span><span style="font-weight:700;color:'+(x.owedN?'var(--blue)':'var(--muted)')+'">'+x.owedN+'</span>'+
      '<span style="color:var(--mid)">'+x.p.decisions.length+'</span><span style="color:var(--mid)">'+esc(x.p.last)+'</span><span class="nx">'+nextBlock(x)+'</span></button>';}).join('')+'</div></div></section>';}
  if(!vis.length)h+='<div class="empty">No people match this view.</div>';
  return h;
}
function itemHTML(it,mine){
  if(S.form&&S.form.id===it.id)return formHTML(mine?'owe':'owed',it.o);
  var label=(it.done?'Reopen: ':(mine?'Mark delivered: ':'Mark received: '))+it.t;
  var due=it.done?'<span class="due ok">Done</span>':(it.od?'<span class="due od">Overdue · was due '+it.due+'</span>':(it.due?'<span class="due">Due '+it.due+'</span>':'<span class="due">No due date</span>'));
  return '<div class="item'+(it.done?' done':'')+'"><button class="chk" data-act="toggle" data-id="'+it.id+'" aria-pressed="'+it.done+'" aria-label="'+esc(label)+'"><span class="box">'+(it.done?'<svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#151619" stroke-width="2"><path d="M2 6.5l2.5 2.5L10 3.5"/></svg>':'')+'</span></button>'+
    '<div class="body"><span class="ttl">'+esc(it.t)+'</span><span class="metarow"><span class="chip c-'+it.k+'">'+it.k+'</span>'+due+'<span>'+esc(it.src)+'</span><span class="'+(it.v?'hv':'ai')+'">● '+(it.v?'Human verified':'AI suggested')+'</span></span></div>'+
    editBtn(mine?'owe':'owed',it)+(mine?'':'<button class="nudge'+(it.nudged?' on':'')+'" data-act="nudge" data-id="'+it.id+'">'+(it.nudged?'Nudge drafted':'Draft nudge')+'</button>')+'</div>';
}
function detailHTML(x){
  var p=x.p,f=esc(x.first);
  var dec=p.pending.map(function(d){return decHTML(d,'pending');}).join('')+p.decisions.map(function(d){return decHTML(d,'decisions');}).join('');
  return '<div><button class="back" data-act="back">← All people</button></div>'+
    '<div class="phead"><div class="id"><span class="av lg" style="'+x.av+'" aria-hidden="true">'+x.initials+'</span><div><h1>'+esc(p.name)+'</h1><div class="meta">'+esc(p.role)+' · '+esc(p.dept)+'</div></div></div>'+
    '<div class="facts"><span>LAST ENGAGEMENT<b>'+esc(p.last)+'</b></span><span>NEXT MEETING<b>'+esc(p.next)+'</b></span></div></div>'+
    '<div class="brief">'+esc(x.brief)+'</div>'+toggleHTML()+(S.mode==='board'?boardHTML(x)+'<div class="cols"><section class="panel"><div class="phd"><h2>Recent engagements</h2></div>'+p.eng.map(function(e){return '<div class="eng"><span class="w">'+e[0]+'</span><span class="t">'+esc(e[1])+'</span><span class="k">'+e[2]+'</span></div>';}).join('')+'</section></div>':
    '<div class="cols"><section class="panel"><div class="phd"><h2>You owe '+f+'</h2><span style="color:var(--accent)">'+x.oweN+' open</span></div>'+(x.owe.map(function(i){return itemHTML(i,true);}).join('')||'<div class="none">Nothing outstanding from you.</div>')+addBar('owe','Add something you owe '+f)+'</section>'+
    '<section class="panel"><div class="phd"><h2>'+f+' owes you</h2><span style="color:var(--blue)">'+x.owedN+' open</span></div>'+(x.owed.map(function(i){return itemHTML(i,false);}).join('')||'<div class="none">Nothing outstanding to you.</div>')+addBar('owed','Add something '+f+' owes you')+'</section></div>'+
    '<div class="cols"><section class="panel"><div class="phd"><h2>Decisions</h2></div>'+(dec||'<div class="none">No decisions captured yet.</div>')+addBar('dec','Add a decision')+'</section>'+
    '<section class="panel"><div class="phd"><h2>Recent engagements</h2></div>'+p.eng.map(function(e){return '<div class="eng"><span class="w">'+e[0]+'</span><span class="t">'+esc(e[1])+'</span><span class="k">'+e[2]+'</span></div>';}).join('')+'</section></div>');
}
function render(keepFocus){
  var all=build();
  var sel=S.sel&&all.filter(function(x){return x.p.id===S.sel;})[0];
  view.innerHTML=sel?detailHTML(sel):listHTML(all);
  var ft=view.querySelector('.edit .ft');if(ft){ft.focus();ft.setSelectionRange(ft.value.length,ft.value.length);}
  if(keepFocus){var q=document.getElementById('q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}}
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,id=b.dataset.id;
  if(a==='open'){S.sel=id;S.form=null;window.scrollTo(0,0);}
  else if(a==='back'){S.sel=null;S.form=null;}
  else if(a==='filter')S.filter=id;
  else if(a==='toggle'){var x=find(person(),id).o;x.done=!x.done;x.st=x.done?2:0;}
  else if(a==='nudge'){var y=find(person(),id).o;y.nudged=!y.nudged;}
  else if(a==='add')S.form={side:b.dataset.side,id:null};
  else if(a==='edit')S.form={side:b.dataset.side,id:id};
  else if(a==='cancel')S.form=null;
  else if(a==='mode'){S.mode=id;S.form=null;}
  else if(a==='mv')moveTo(id,+b.dataset.to);
  else if(a==='del'){var z=find(person(),S.form.id);if(z)z.arr.splice(z.idx,1);S.form=null;}
  render();
});
view.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target,side=f.dataset.side,p=person(),t=f.elements.t.value.trim(),k=f.elements.k.value,due=f.elements.due.value,fm=S.form;
  if(!t||!fm)return;
  if(side==='dec'){
    if(fm.id){var x=find(p,fm.id);x.o.t=t;if(due)x.o.due=due;if(x.list!==k){x.arr.splice(x.idx,1);p[k].unshift(x.o);}}
    else p[k].unshift({id:uid(),t:t,due:due||TODAY,src:'Added manually'});
  }else{
    if(fm.id){var o=find(p,fm.id).o;o.t=t;o.k=k;o.due=due;o.v=1;}
    else p[side].push({id:uid(),k:k,t:t,due:due,src:'Added manually',v:1,done:false,nudged:false});
  }
  S.form=null;render();
});
var drag=null;
view.addEventListener('dragstart',function(e){var c=e.target.closest&&e.target.closest('[data-card]');if(!c)return;var cell=c.closest('.kc');drag={id:c.dataset.card,row:cell.dataset.row};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',drag.id);c.classList.add('dragging');});
view.addEventListener('dragover',function(e){var cell=e.target.closest&&e.target.closest('.kc');if(!drag||!cell||cell.dataset.row!==drag.row)return;e.preventDefault();[].forEach.call(view.querySelectorAll('.kc.over'),function(n){n.classList.remove('over');});cell.classList.add('over');});
view.addEventListener('drop',function(e){var cell=e.target.closest&&e.target.closest('.kc');if(!drag||!cell||cell.dataset.row!==drag.row)return;e.preventDefault();moveTo(drag.id,+cell.dataset.st);drag=null;render();});
view.addEventListener('dragend',function(){drag=null;[].forEach.call(view.querySelectorAll('.over,.dragging'),function(n){n.classList.remove('over','dragging');});});
view.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.form){S.form=null;render();}});
view.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;render(true);}});
render();
})();
</script>
</body>
</html>
